<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - ShopEase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-wrapper">
  <div class="container">

    <div class="breadcrumb">
      <a href="index.html">Home</a>
      <span class="breadcrumb-sep">/</span>
      <span class="breadcrumb-current">My Orders</span>
    </div>

    <div class="section-header d-flex justify-between align-center flex-wrap gap-2">
      <div>
        <h2>Purchase History</h2>
        <p class="section-subtitle">Track, review, or pay for your recent orders</p>
      </div>
      <div>
        <select id="order-status-filter" class="form-control" style="width: auto;">
          <option value="ALL">All Order Statuses</option>
          <option value="PAYMENT_PENDING">Payment Pending</option>
          <option value="PROCESSING">Processing</option>
          <option value="CONFIRMED">Confirmed</option>
          <option value="SHIPPED">Shipped</option>
          <option value="DELIVERED">Delivered</option>
          <option value="CANCELLED">Cancelled</option>
        </select>
      </div>
    </div>

    <!-- Empty State -->
    <div id="orders-empty" class="empty-state card hidden">
      <div class="empty-state-icon">📦</div>
      <h3>No Orders Yet</h3>
      <p>You haven't placed any orders yet. Start exploring our product catalogue!</p>
      <a href="products.html" class="btn btn-primary">Start Shopping</a>
    </div>

    <!-- Orders List -->
    <div id="orders-container" class="grid" style="grid-template-columns: 1fr; gap: 1.25rem;"></div>

  </div>
</div>

<script src="js/api.js"></script>
<script>
  async function loadOrders() {
    if (!requireAuth()) return;

    const container = document.getElementById('orders-container');
    const emptyEl = document.getElementById('orders-empty');
    const filterVal = document.getElementById('order-status-filter').value;

    container.innerHTML = `
      <div class="loading-state">
        <div class="spinner spinner-lg"></div>
        <p>Loading your order history from server...</p>
      </div>`;
    emptyEl.classList.add('hidden');

    try {
      const res = await OrderAPI.list();
      let orders = (res && res.success && res.data) ? res.data : [];

      if (!orders || orders.length === 0) {
        emptyEl.classList.remove('hidden');
        container.innerHTML = '';
        return;
      }

      // Filter
      if (filterVal !== 'ALL') {
        orders = orders.filter(o => o.orderStatus === filterVal);
      }

      if (orders.length === 0) {
        container.innerHTML = '<div class="card p-3 text-center text-muted">No orders match the selected filter.</div>';
        return;
      }

      container.innerHTML = '';

      for (const order of orders) {
        const orderId = order.id;
        const currentPayStatus = order.paymentStatus || 'PENDING';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header d-flex justify-between align-center flex-wrap gap-1">
            <div>
              <strong>Order #${order.orderNumber || orderId}</strong>
              <span class="text-small text-muted" style="margin-left: 0.5rem;">Placed on ${formatDate(order.createdAt)}</span>
            </div>
            <div class="d-flex align-center gap-1">
              ${orderStatusBadge(order.orderStatus || 'PAYMENT_PENDING')}
              ${paymentStatusBadge(currentPayStatus)}
            </div>
          </div>

          <div class="card-body">
            <div class="d-flex justify-between align-center flex-wrap gap-2">
              <div>
                <div class="text-small text-muted">Total Amount</div>
                <div class="price price-large text-primary">${formatCurrency(order.totalAmount)}</div>
                <div class="text-small text-muted mt-1">Payment Method: <strong>${order.paymentMethod || 'CREDIT_CARD'}</strong></div>
              </div>

              <div class="d-flex gap-1">
                ${currentPayStatus === 'PENDING' || currentPayStatus === 'FAILED' ? `
                  <a href="payment.html?orderId=${orderId}" class="btn btn-primary btn-sm">
                    💳 Complete Payment
                  </a>
                ` : ''}
                <a href="order-details.html?orderId=${orderId}" class="btn btn-secondary btn-sm">
                  View Full Details ➔
                </a>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      }
    } catch (err) {
      container.innerHTML = `
        <div class="card p-3 text-center text-danger">
          <p>Failed to load orders from backend.</p>
          <small class="text-muted">${err.message || 'Please check your connection or log in again.'}</small>
        </div>`;
      Toast.error(err.message || 'Failed to load order history');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderNavbar('orders');
    renderFooter();

    document.getElementById('order-status-filter').addEventListener('change', loadOrders);
    loadOrders();
  });
</script>
</body>
</html>
